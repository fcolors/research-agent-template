name: sync-zotero-annotations

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时整点
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-zotero-annotations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出模板仓库
        uses: actions/checkout@v4
        with:
          path: template

      - name: 检出源仓库（独立 skill 仓库，只读）
        uses: actions/checkout@v4
        with:
          repository: fcolors/zotero-annotations
          path: source

      - name: 覆盖同步 skill 到 .agents/skills/
        run: |
          set -eu
          rm -rf "template/.agents/skills/zotero-annotations"
          cp -a "source/skills/zotero-annotations" "template/.agents/skills/zotero-annotations"
          find "template/.agents/skills/zotero-annotations" -name __pycache__ -type d -prune -exec rm -rf {} +
          find "template/.agents/skills/zotero-annotations" -name '*.pyc' -delete
          echo "已同步:" && ls "template/.agents/skills/zotero-annotations"

      - name: 提交并推送（先取远端最新，避免 non-fast-forward 被拒）
        run: |
          set -eu
          cd template
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 以远端 main 为准，丢弃本地任何残留提交（幂等重放）
          git fetch origin main
          git reset --hard origin/main
          rm -rf .agents/skills/zotero-annotations
          cp -a ../source/skills/zotero-annotations .agents/skills/zotero-annotations
          find .agents/skills/zotero-annotations -name __pycache__ -type d -prune -exec rm -rf {} +
          find .agents/skills/zotero-annotations -name '*.pyc' -delete

          git add .agents/skills/zotero-annotations
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "sync(zotero-annotations): 每6小时从独立仓库同步 skill"
            git push
          fi